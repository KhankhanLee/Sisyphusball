# Runs Sisyphusball on one Linux VM: the Mainnet game server, a Testnet copy
# for trying changes out (its own ranking and Pi app), and Caddy in front of
# both for automatic HTTPS (Let's Encrypt) and compression.
services:
  app:
    image: ghcr.io/khankhanlee/sisyphusball:latest
    restart: unless-stopped
    env_file: .env # CONTACT_EMAIL, PI_VALIDATION_KEY
    environment:
      APP_ENV: production
      DATA_FILE: /data/scores.json
    volumes:
      - ./data:/data # ranking + daily backups live on the VM disk
    expose:
      - "8080"

  app-testnet:
    image: ghcr.io/khankhanlee/sisyphusball:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DATA_FILE: /data/scores.json
      # The Testnet app in the Pi Developer Portal has its own key.
      PI_VALIDATION_KEY: ${TESTNET_PI_VALIDATION_KEY:-}
      # ...and its own server API key (Carve the Mountain payments).
      PI_API_KEY: ${TESTNET_PI_API_KEY:-}
    volumes:
      - ./data-testnet:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env # DOMAIN, TESTNET_DOMAIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - app-testnet

volumes:
  caddy_data:
  caddy_config:
