<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="There is no summit. Push anyway. — A Sisyphean ball-rolling game on Pi Network">
  <meta name="theme-color" content="#14111C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sisyphusball">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Sisyphusball</title>
  <style>html, body { margin: 0; background: #14111C; }</style>
  <script>
    // Boot report: tells the server log what this browser supports, so issues
    // inside the Pi Browser (which we cannot inspect directly) can be found.
    (function () {
      function send(event, detail) {
        // also used by flutter_bootstrap.js
        try {
          var body = JSON.stringify({ event: event, detail: detail, ua: navigator.userAgent });
          if (!(navigator.sendBeacon && navigator.sendBeacon('api/client-log', body))) {
            fetch('api/client-log', { method: 'POST', body: body, keepalive: true });
          }
        } catch (e) {}
      }
      function gl() {
        try {
          var c = document.createElement('canvas');
          return c.getContext('webgl2') ? 'webgl2' : (c.getContext('webgl') ? 'webgl1' : 'none');
        } catch (e) { return 'error'; }
      }
      window.sisyphusReport = send;
      window.addEventListener('error', function (e) {
        send('js-error', (e.message || 'error') + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        send('js-rejection', String(e.reason && (e.reason.message || e.reason)));
      });
      window.addEventListener('load', function () {
        send('boot', [
          'gl=' + gl(),
          'wasm=' + (typeof WebAssembly === 'object'),
          'segmenter=' + (typeof Intl === 'object' && 'Segmenter' in Intl),
          'framed=' + (window.self !== window.top),
          'piSdk=' + (typeof window.Pi === 'object'),
          'dpr=' + window.devicePixelRatio,
          'size=' + window.innerWidth + 'x' + window.innerHeight
        ].join(' '));
      });
    })();
  </script>
  <!-- Pi Network SDK: exposes window.Pi, used from Dart via dart:js_interop -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
